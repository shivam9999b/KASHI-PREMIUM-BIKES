<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>लॉगिन - वाराणसी Vehicles</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <i class="fas fa-ghat"></i>
                <span>वाराणसी <span class="highlight">Vehicles</span></span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fas fa-home"></i> होम</a></li>
                <li><a href="listings.html"><i class="fas fa-list"></i> सभी गाड़ियाँ</a></li>
            </ul>
        </div>
    </nav>

    <!-- ===== LOGIN FORM ===== -->
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <i class="fas fa-sign-in-alt"></i>
                    <h2>वापसी का स्वागत है</h2>
                    <p>अपने खाते में लॉगिन करें</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> ईमेल</label>
                        <input type="email" id="loginEmail" placeholder="your@email.com" required />
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> पासवर्ड</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required />
                        <span class="toggle-password" onclick="togglePassword('loginPassword')">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" /> मुझे याद रखें
                        </label>
                        <a href="#" class="forgot-link">पासवर्ड भूल गए?</a>
                    </div>

                    <button type="submit" class="btn-auth">
                        <i class="fas fa-spinner fa-spin" id="loginSpinner" style="display:none;"></i>
                        <span id="loginText">लॉगिन करें</span>
                    </button>
                </form>

                <div class="auth-divider">
                    <span>या</span>
                </div>

                <button class="btn-google" onclick="googleLogin()">
                    <i class="fab fa-google"></i> Google से लॉगिन करें
                </button>

                <p class="auth-footer">
                    नए हैं? <a href="signup.html">खाता बनाएं</a>
                </p>
            </div>

            <!-- ===== BANARAS SIDE IMAGE ===== -->
            <div class="auth-side">
                <div class="auth-side-content">
                    <i class="fas fa-ganga"></i>
                    <h3>काशी की पहचान</h3>
                    <p>वाराणसी के लोगों के लिए<br />भरोसेमंद वाहन मार्केटप्लेस</p>
                    <div class="auth-testimonial">
                        <i class="fas fa-quote-left"></i>
                        <p>"यहाँ अपनी बाइक बेची, बहुत अच्छा अनुभव रहा"</p>
                        <span>- राजेश, वाराणसी</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script type="module">
        import { logIn } from './js/auth.js';
        import { signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { auth } from './js/firebase.js';

        const form = document.getElementById('loginForm');
        const spinner = document.getElementById('loginSpinner');
        const text = document.getElementById('loginText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            spinner.style.display = 'inline-block';
            text.textContent = 'लॉगिन हो रहा...';

            await logIn(email, password);

            spinner.style.display = 'none';
            text.textContent = 'लॉगिन करें';
        });

        // Google Login
        window.googleLogin = async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                alert('✅ Google से लॉगिन सफल!');
                window.location.href = 'index.html';
            } catch (error) {
                alert('❌ ' + error.message);
            }
        };

        // Toggle Password
        window.togglePassword = (id) => {
            const input = document.getElementById(id);
            const icon = event.currentTarget.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        };
    </script>
</body>
</html>
