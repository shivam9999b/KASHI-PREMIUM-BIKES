<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>साइनअप - वाराणसी Vehicles</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <i class="fas fa-ghat"></i>
                <span>वाराणसी <span class="highlight">Vehicles</span></span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fas fa-home"></i> होम</a></li>
                <li><a href="listings.html"><i class="fas fa-list"></i> सभी गाड़ियाँ</a></li>
            </ul>
        </div>
    </nav>

    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <i class="fas fa-user-plus"></i>
                    <h2>नया खाता बनाएं</h2>
                    <p>वाराणसी Vehicles पर आपका स्वागत है</p>
                </div>

                <form id="signupForm" class="auth-form">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> पूरा नाम</label>
                        <input type="text" id="signupName" placeholder="आपका नाम" required />
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-phone"></i> मोबाइल नंबर</label>
                        <input type="tel" id="signupPhone" placeholder="99999 88888" required />
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> ईमेल</label>
                        <input type="email" id="signupEmail" placeholder="your@email.com" required />
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> पासवर्ड</label>
                        <input type="password" id="signupPassword" placeholder="•••••••• (6+ characters)" required />
                        <span class="toggle-password" onclick="togglePassword('signupPassword')">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-check-circle"></i> पासवर्ड कन्फर्म करें</label>
                        <input type="password" id="signupConfirm" placeholder="पासवर्ड दोबारा डालें" required />
                    </div>

                    <div class="form-check">
                        <input type="checkbox" id="termsCheck" required />
                        <label for="termsCheck">मैं <a href="#">Terms & Conditions</a> से सहमत हूँ</label>
                    </div>

                    <button type="submit" class="btn-auth">
                        <i class="fas fa-spinner fa-spin" id="signupSpinner" style="display:none;"></i>
                        <span id="signupText">खाता बनाएं</span>
                    </button>
                </form>

                <div class="auth-divider">
                    <span>या</span>
                </div>

                <button class="btn-google" onclick="googleSignup()">
                    <i class="fab fa-google"></i> Google से साइनअप करें
                </button>

                <p class="auth-footer">
                    पहले से खाता है? <a href="login.html">लॉगिन करें</a>
                </p>
            </div>

            <div class="auth-side">
                <div class="auth-side-content">
                    <i class="fas fa-handshake"></i>
                    <h3>सुरक्षित और भरोसेमंद</h3>
                    <p>100% verified listings<br />बिना किसी कमीशन के</p>
                    <div class="auth-features">
                        <span><i class="fas fa-shield-alt"></i> सुरक्षित</span>
                        <span><i class="fas fa-clock"></i> 24/7</span>
                        <span><i class="fas fa-rupee-sign"></i> कोई चार्ज नहीं</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script type="module">
        import { signUp } from './js/auth.js';
        import { signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { auth } from './js/firebase.js';

        const form = document.getElementById('signupForm');
        const spinner = document.getElementById('signupSpinner');
        const text = document.getElementById('signupText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('signupName').value;
            const phone = document.getElementById('signupPhone').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;

            if (password !== confirm) {
                alert('❌ पासवर्ड मैच नहीं कर रहा!');
                return;
            }

            if (password.length < 6) {
                alert('❌ पासवर्ड कम से कम 6 अक्षर का होना चाहिए!');
                return;
            }

            spinner.style.display = 'inline-block';
            text.textContent = 'खाता बन रहा...';

            await signUp(email, password, name);

            spinner.style.display = 'none';
            text.textContent = 'खाता बनाएं';
        });

        window.googleSignup = async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                alert('✅ Google से साइनअप सफल!');
                window.location.href = 'index.html';
            } catch (error) {
                alert('❌ ' + error.message);
            }
        };

        window.togglePassword = (id) => {
            const input = document.getElementById(id);
            const icon = event.currentTarget.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        };
    </script>
</body>
</html>
