<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>गाड़ियाँ मैनेज करें - Admin</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

    <!-- ===== ADMIN NAVBAR ===== -->
    <nav class="admin-navbar">
        <div class="admin-container">
            <div class="admin-logo">
                <i class="fas fa-ghat"></i>
                <span>Admin <span class="highlight">Panel</span></span>
            </div>
            <div class="admin-user">
                <span id="adminEmail">admin@email.com</span>
                <img src="https://ui-avatars.com/api/?name=Admin&background=d4a373&color=fff" alt="Admin" />
                <button onclick="logoutAdmin()" class="btn-logout-admin">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="admin-wrapper">
        <!-- ===== SIDEBAR ===== -->
        <aside class="admin-sidebar">
            <ul class="sidebar-menu">
                <li><a href="index.html"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a></li>
                <li class="active"><a href="manage-vehicles.html"><i class="fas fa-car"></i><span>गाड़ियाँ मैनेज करें</span></a></li>
                <li><a href="manage-users.html"><i class="fas fa-users"></i><span>यूज़र मैनेज करें</span></a></li>
                <li><a href="reports.html"><i class="fas fa-chart-bar"></i><span>रिपोर्ट्स</span></a></li>
                <li><a href="settings.html"><i class="fas fa-cog"></i><span>सेटिंग्स</span></a></li>
            </ul>
        </aside>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="admin-content">
            <div class="admin-header">
                <h1><i class="fas fa-car"></i> सभी गाड़ियाँ</h1>
                <div class="admin-actions">
                    <div class="search-box">
                        <input type="text" id="searchVehicle" placeholder="🔍 गाड़ी खोजें..." oninput="filterVehicles()" />
                    </div>
                    <select id="filterType" onchange="filterVehicles()" class="filter-select">
                        <option value="all">सभी प्रकार</option>
                        <option value="bike">🏍️ बाइक</option>
                        <option value="car">🚗 कार</option>
                    </select>
                    <button class="btn-add" onclick="window.location.href='../post-vehicle.html'">
                        <i class="fas fa-plus"></i> नई गाड़ी डालें
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table class="admin-table" id="vehiclesTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>गाड़ी</th>
                            <th>प्रकार</th>
                            <th>कीमत</th>
                            <th>शहर</th>
                            <th>मालिक</th>
                            <th>डाली गई</th>
                            <th>एक्शन</th>
                        </tr>
                    </thead>
                    <tbody id="vehiclesList">
                        <!-- JavaScript से आएगा -->
                    </tbody>
                </table>
            </div>

            <!-- ===== PAGINATION ===== -->
            <div class="pagination" id="pagination">
                <button onclick="prevPage()"><i class="fas fa-chevron-left"></i></button>
                <span id="pageInfo">पेज 1 / 1</span>
                <button onclick="nextPage()"><i class="fas fa-chevron-right"></i></button>
            </div>
        </main>
    </div>

    <!-- ===== EDIT MODAL ===== -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-edit"></i> गाड़ी अपडेट करें</h3>
                <span class="modal-close" onclick="closeModal()">&times;</span>
            </div>
            <form id="editForm" class="modal-body">
                <input type="hidden" id="editId" />
                <div class="form-group">
                    <label>टाइटल</label>
                    <input type="text" id="editTitle" required />
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>कीमत (₹)</label>
                        <input type="number" id="editPrice" required />
                    </div>
                    <div class="form-group">
                        <label>शहर</label>
                        <input type="text" id="editCity" required />
                    </div>
                </div>
                <div class="form-group">
                    <label>विवरण</label>
                    <textarea id="editDesc" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-save"><i class="fas fa-save"></i> सेव करें</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth, db } from '../js/firebase.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { collection, getDocs, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let allVehicles = [];
        let filteredVehicles = [];
        let currentPage = 1;
        const perPage = 10;

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = '../login.html';
            else loadVehicles();
        });

        async function loadVehicles() {
            try {
                const q = query(collection(db, 'vehicles'), orderBy('timestamp', 'desc'));
                const snap = await getDocs(q);
                allVehicles = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                filteredVehicles = [...allVehicles];
                renderVehicles();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function renderVehicles() {
            const tbody = document.getElementById('vehiclesList');
            const start = (currentPage - 1) * perPage;
            const end = start + perPage;
            const pageData = filteredVehicles.slice(start, end);

            if (pageData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:#888;">
                    <i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:10px;"></i>
                    कोई गाड़ी नहीं मिली
                </td></tr>`;
                return;
            }

            tbody.innerHTML = pageData.map((v, i) => `
                <tr>
                    <td>${start + i + 1}</td>
                    <td>
                        <div class="vehicle-info">
                            <img src="${v.imageUrl || 'https://via.placeholder.com/40'}" alt="${v.title}" 
                                 onerror="this.src='https://via.placeholder.com/40'" />
                            <span>${v.title || 'No Title'}</span>
                        </div>
                    </td>
                    <td><span class="badge ${v.type}">${v.type === 'bike' ? '🏍️ बाइक' : '🚗 कार'}</span></td>
                    <td>₹${(v.price || 0).toLocaleString()}</td>
                    <td>${v.city || 'वाराणसी'}</td>
                    <td>${v.userEmail || 'N/A'}</td>
                    <td>${v.timestamp ? new Date(v.timestamp).toLocaleDateString('hi-IN') : 'N/A'}</td>
                    <td>
                        <button class="btn-icon" onclick="editVehicle('${v.id}')" title="Edit">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-icon delete" onclick="deleteVehicle('${v.id}')" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                        <button class="btn-icon" onclick="viewVehicle('${v.id}')" title="View">
                            <i class="fas fa-eye"></i>
                        </button>
                    </td>
                </tr>
            `).join('');

            updatePagination();
        }

        // ===== FILTER =====
        window.filterVehicles = () => {
            const search = document.getElementById('searchVehicle').value.toLowerCase();
            const type = document.getElementById('filterType').value;
            
            filteredVehicles = allVehicles.filter(v => {
                const matchSearch = v.title?.toLowerCase().includes(search) || 
                                   v.description?.toLowerCase().includes(search) ||
                                   v.city?.toLowerCase().includes(search);
                const matchType = type === 'all' || v.type === type;
                return matchSearch && matchType;
            });
            
            currentPage = 1;
            renderVehicles();
        };

        // ===== PAGINATION =====
        window.prevPage = () => {
            if (currentPage > 1) { currentPage--; renderVehicles(); }
        };

        window.nextPage = () => {
            const maxPage = Math.ceil(filteredVehicles.length / perPage);
            if (currentPage < maxPage) { currentPage++; renderVehicles(); }
        };

        function updatePagination() {
            const maxPage = Math.ceil(filteredVehicles.length / perPage) || 1;
            document.getElementById('pageInfo').textContent = `पेज ${currentPage} / ${maxPage}`;
        }

        // ===== EDIT VEHICLE =====
        window.editVehicle = (id) => {
            const v = allVehicles.find(item => item.id === id);
            if (!v) return;
            
            document.getElementById('editId').value = id;
            document.getElementById('editTitle').value = v.title || '';
            document.getElementById('editPrice').value = v.price || '';
            document.getElementById('editCity').value = v.city || '';
            document.getElementById('editDesc').value = v.description || '';
            document.getElementById('editModal').style.display = 'flex';
        };

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const data = {
                title: document.getElementById('editTitle').value,
                price: parseInt(document.getElementById('editPrice').value),
                city: document.getElementById('editCity').value,
                description: document.getElementById('editDesc').value,
                updatedAt: new Date().toISOString()
            };
            
            try {
                await updateDoc(doc(db, 'vehicles', id), data);
                alert('✅ गाड़ी अपडेट हो गई!');
                closeModal();
                loadVehicles();
            } catch (error) {
                alert('❌ ' + error.message);
            }
        });

        window.closeModal = () => {
            document.getElementById('editModal').style.display = 'none';
        };

        // ===== DELETE =====
        window.deleteVehicle = async (id) => {
            if (!confirm('क्या आप सच में यह गाड़ी डिलीट करना चाहते हैं?')) return;
            try {
                await deleteDoc(doc(db, 'vehicles', id));
                alert('✅ गाड़ी डिलीट हो गई!');
                loadVehicles();
            } catch (error) {
                alert('❌ ' + error.message);
            }
        };

        // ===== VIEW =====
        window.viewVehicle = (id) => {
            window.open(`../vehicle-detail.html?id=${id}`, '_blank');
        };

        window.logoutAdmin = () => {
            auth.signOut();
            window.location.href = '../index.html';
        };
    </script>
</body>
</html>
